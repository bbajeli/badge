<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Badge">
<meta name="theme-color" content="#0f172a">
<title>Badge</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#0f172a;--mu:#64748b;--ac:#2563eb;--ok:#16a34a;--ko:#dc2626;--bd:#e2e8f0;
box-sizing:border-box;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#162033;--tx:#e5e9f0;--mu:#94a3b8;--bd:#263449}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:0 0 10px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav b{font-size:17px;text-align:center;flex:1}
button,select,input{font:inherit;color:inherit}
.ico{background:var(--bg);border:1px solid var(--bd);border-radius:10px;width:42px;height:42px;font-size:18px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.big button{border:0;border-radius:14px;padding:22px 0;font-size:19px;font-weight:700;color:#fff}
#bin{background:var(--ok)}#bout{background:var(--ko)}
.big button:disabled{opacity:.3}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:8px}
.seg button.on{background:var(--ac);color:#fff;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.mu{color:var(--mu);font-size:14px}
.tot{font-size:34px;font-weight:700;margin:4px 0}
.pos{color:var(--ok)}.neg{color:var(--ko)}
.x{background:none;border:0;color:var(--ko);font-size:18px;padding:4px 10px}
.add{display:flex;gap:8px;margin-top:10px}
.add input,.add select{flex:1;min-width:0;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.add button,.btn{padding:9px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.live{font-size:13px;color:var(--ok)}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="nav">
      <button class="ico" id="dprev">‹</button>
      <b id="dlabel"></b>
      <button class="ico" id="dnext">›</button>
    </div>
    <div class="big">
      <button id="bin">Badge IN</button>
      <button id="bout">Badge OUT</button>
    </div>
    <div id="punches"></div>
    <div class="add">
      <input type="time" id="mtime">
      <select id="mtype"><option value="in">IN</option><option value="out">OUT</option></select>
      <button id="madd">Aggiungi</button>
    </div>
  </div>

  <div class="card">
    <h2>Pausa pranzo</h2>
    <div class="seg" id="lunch">
      <button data-v="0">Nessuna</button><button data-v="30">30 min</button><button data-v="60">1 ora</button>
    </div>
    <div class="row" style="margin-top:10px"><span>Ore nette del giorno</span><b id="dnet">–</b></div>
    <div class="live" id="live"></div>
  </div>

  <div class="card">
    <h2>Bilancio</h2>
    <div class="seg" id="period">
      <button data-v="day">Giorno</button><button data-v="week">Settimana</button><button data-v="month">Mese</button>
    </div>
    <div class="nav" style="margin-top:12px">
      <button class="ico" id="pprev">‹</button>
      <b id="plabel"></b>
      <button class="ico" id="pnext">›</button>
    </div>
    <div class="tot" id="ptot"></div>
    <div class="mu" id="pdiff"></div>
    <div id="plist" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <h2>Impostazioni e dati</h2>
    <div class="row"><span>Ore giornaliere previste</span><input type="number" id="target" min="0" max="24" step="0.25" style="width:80px;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);text-align:right"></div>
    <div class="add">
      <button class="btn g" id="exp">Esporta JSON</button>
      <button class="btn g" id="imp">Importa JSON</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </div>
</main>

<script>
const KEY='badge.v1';
let S={days:{},target:8};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const hm=m=>{const s=m<0?'-':'';m=Math.abs(Math.round(m));return s+Math.floor(m/60)+'h '+pad(m%60)+'m'};
const tm=iso=>{const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes())};
const day=k=>S.days[k]||(S.days[k]={punches:[],lunch:0});
const isWork=d=>d.getDay()>0&&d.getDay()<6;

let cur=key(new Date()), period='day', pref=new Date();

function minutes(k){
  const D=S.days[k]; if(!D||!D.punches.length)return{m:0,open:false};
  const p=[...D.punches].sort((a,b)=>a.t<b.t?-1:1);
  let tot=0,start=null,open=false;
  for(const x of p){
    if(x.type==='in'){if(start===null)start=new Date(x.t)}
    else if(start!==null){tot+=(new Date(x.t)-start)/6e4;start=null}
  }
  if(start!==null){open=true;if(k===key(new Date()))tot+=(new Date()-start)/6e4}
  const lunch=Math.min(D.lunch||0,tot);
  return{m:Math.max(0,tot-lunch),open};
}

function renderDay(){
  const d=parse(cur), today=cur===key(new Date());
  $('dlabel').textContent=(today?'Oggi · ':'')+d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  const D=S.days[cur]||{punches:[],lunch:0};
  const p=[...D.punches].sort((a,b)=>a.t<b.t?-1:1);
  const last=p[p.length-1];
  $('bin').disabled=!(today&&(!last||last.type==='out'));
  $('bout').disabled=!(today&&last&&last.type==='in');
  $('punches').innerHTML=p.length?p.map(x=>`<div class="row"><span>${x.type==='in'?'🟢 Entrata':'🔴 Uscita'}</span><span><b>${tm(x.t)}</b><button class="x" data-t="${x.t}">✕</button></span></div>`).join(''):'<div class="mu">Nessuna timbratura</div>';
  document.querySelectorAll('#lunch button').forEach(b=>b.classList.toggle('on',+b.dataset.v===(D.lunch||0)));
  const r=minutes(cur);
  $('dnet').textContent=hm(r.m);
  $('live').textContent=r.open&&today?'● In corso: il tempo sta scorrendo':(r.open?'⚠ Manca l’uscita':'');
  const nxt=new Date(); $('dnext').disabled=cur>=key(nxt);
}

function range(){
  let a,b,label;
  if(period==='day'){a=b=new Date(pref.getFullYear(),pref.getMonth(),pref.getDate());label=a.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
  else if(period==='week'){const w=(pref.getDay()+6)%7;a=new Date(pref.getFullYear(),pref.getMonth(),pref.getDate()-w);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);label=a.toLocaleDateString('it-IT',{day:'numeric',month:'short'})+' – '+b.toLocaleDateString('it-IT',{day:'numeric',month:'short'})}
  else{a=new Date(pref.getFullYear(),pref.getMonth(),1);b=new Date(pref.getFullYear(),pref.getMonth()+1,0);label=a.toLocaleDateString('it-IT',{month:'long',year:'numeric'})}
  return{a,b,label};
}

function renderPeriod(){
  document.querySelectorAll('#period button').forEach(x=>x.classList.toggle('on',x.dataset.v===period));
  const{a,b,label}=range(); $('plabel').textContent=label;
  const todayK=key(new Date());
  let tot=0,exp=0,rows='';
  for(let d=new Date(a);d<=b;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){
    const k=key(d), m=minutes(k).m, has=S.days[k]&&S.days[k].punches.length;
    tot+=m;
    if(isWork(d)&&k<=todayK)exp+=S.target*60;
    if(has||period==='day')rows+=`<div class="row"><span>${d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}</span><b>${hm(m)}</b></div>`;
  }
  $('ptot').textContent=hm(tot);
  const diff=tot-exp;
  $('pdiff').innerHTML=`Previste: ${hm(exp)} · Saldo: <b class="${diff>=0?'pos':'neg'}">${diff>=0?'+':''}${hm(diff)}</b>`;
  $('plist').innerHTML=rows||'<div class="mu">Nessun dato</div>';
}

function render(){renderDay();renderPeriod();$('target').value=S.target}

function punch(type,date=new Date()){
  day(cur).punches.push({t:date.toISOString(),type});save();render();
}
$('bin').onclick=()=>punch('in');
$('bout').onclick=()=>punch('out');
$('madd').onclick=()=>{
  const v=$('mtime').value; if(!v)return;
  const[h,m]=v.split(':').map(Number),d=parse(cur);d.setHours(h,m,0,0);
  punch($('mtype').value,d);
};
$('punches').onclick=e=>{
  const t=e.target.dataset&&e.target.dataset.t; if(!t)return;
  const D=day(cur);D.punches=D.punches.filter(x=>x.t!==t);save();render();
};
$('lunch').onclick=e=>{
  if(!e.target.dataset.v)return;day(cur).lunch=+e.target.dataset.v;save();render();
};
const shiftDay=n=>{const d=parse(cur);d.setDate(d.getDate()+n);cur=key(d);pref=parse(cur);render()};
$('dprev').onclick=()=>shiftDay(-1);
$('dnext').onclick=()=>shiftDay(1);
$('period').onclick=e=>{if(!e.target.dataset.v)return;period=e.target.dataset.v;renderPeriod()};
const shiftP=n=>{
  if(period==='day')pref.setDate(pref.getDate()+n);
  else if(period==='week')pref.setDate(pref.getDate()+7*n);
  else pref=new Date(pref.getFullYear(),pref.getMonth()+n,1);
  renderPeriod();
};
$('pprev').onclick=()=>shiftP(-1);
$('pnext').onclick=()=>shiftP(1);
$('target').onchange=e=>{S.target=Math.max(0,+e.target.value||0);save();renderPeriod()};

$('exp').onclick=()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='badge-'+key(new Date())+'.json';a.click();
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  f.text().then(t=>{try{const o=JSON.parse(t);if(o&&o.days){S=Object.assign({days:{},target:8},o);save();render()}else alert('File non valido')}catch(_){alert('File non valido')}});
};
setInterval(()=>{if(cur===key(new Date()))render()},30000);
render();
</script>
</body>
</html>
